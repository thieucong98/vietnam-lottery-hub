# Chặn thuật ngữ lô đề, "dự đoán" và khung "đầu tư" quay lại qua PR
name: Compliance Lint & Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Compliance lint (web/src, engine, scripts, README, JSON xuất ra)
        run: |
          python scripts/compliance_lint.py

      - name: 4. Cài đặt astral-sh/setup-uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 5. Chạy Pytest
        run: |
          uv sync --all-extras
          uv run pytest

      - name: 5b. Kiểm tra schema JSON dữ liệu xuất bản
        run: |
          uv run python scripts/validate_data_schema.py

      - name: 5c. Budget kích thước dữ liệu
        run: |
          python scripts/check_size_budget.py --only data

      - name: 6. Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: 7. Cài đặt dependencies Web
        working-directory: web
        run: npm ci

      - name: 8. ESLint
        working-directory: web
        run: npm run lint

      - name: 9. Vitest (utils, logic dò vé, URL, gói dữ liệu, component cơ bản)
        working-directory: web
        run: npm test

      - name: 10. Build Web
        working-directory: web
        run: npm run build

      - name: 11. Ngân sách dung lượng (dữ liệu lúc mở trang < 100 KB)
        working-directory: web
        run: npm run check:data-budget

      - name: 11b. Budget kích thước bundle (size-budget.json)
        run: python scripts/check_size_budget.py --only bundle

      - name: 12. Compliance lint trên bản build
        run: python scripts/compliance_lint.py web/dist

      - name: 13. Cài đặt trình duyệt Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: 14. Playwright smoke test (5 luồng chính, desktop + mobile)
        working-directory: web
        run: npm run test:e2e

      - name: 15. Lưu báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
