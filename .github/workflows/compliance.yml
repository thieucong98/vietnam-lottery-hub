# Chặn thuật ngữ lô đề, "dự đoán" và khung "đầu tư" quay lại qua PR
name: Compliance Lint & Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Compliance lint (web/src, engine, scripts, README, JSON xuất ra)
        run: |
          python scripts/compliance_lint.py

      - name: 4. Cài đặt astral-sh/setup-uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 5. Chạy Pytest
        run: |
          uv sync --all-extras
          uv run pytest

      - name: 5b. Kiểm tra schema JSON dữ liệu xuất bản
        run: |
          uv run python scripts/validate_data_schema.py

      - name: 5c. Budget kích thước dữ liệu
        run: |
          python scripts/check_size_budget.py --only data

      - name: 6. Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: 7. Build Web & lint bản build
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          python scripts/compliance_lint.py web/dist

      - name: 8. Budget kích thước bundle
        run: |
          python scripts/check_size_budget.py --only bundle
