# Pipeline Tự Động Build & Deploy Web Lên GitHub Pages
name: Deploy Web Application to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '!web/public/data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "lottery-pipeline"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: 3. Cài đặt Dependencies Web
        run: |
          cd web
          npm ci

      - name: 4. Build Ứng Dụng Web React
        run: |
          cd web
          npm run build

      - name: 5. Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: 6. Tải Artifact Lên Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: 7. Deploy Lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
